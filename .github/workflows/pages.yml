name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prefer GitHub Actions deploy when Pages is enabled for Actions.
# If the token cannot create the site, enable classic Pages:
# Settings → Pages → Branch: main → folder: /docs
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm static docs
        run: |
          test -f docs/index.html
          test -f docs/cli.html
          test -f docs/plugins.html
          test -f docs/install.html
          test -f docs/confidence.html
          test -f docs/judge.html
          test -f docs/workflow.html
          test -f docs/memory.html
          test -f docs/research.html
          test -f docs/languages.html
          test -f docs/assets/style.css
          test -f docs/assets/site.js
          test -f docs/.nojekyll
      - id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.configure.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - if: steps.configure.outcome != 'success'
        name: Classic Pages reminder
        run: |
          echo "Actions could not enable GitHub Pages (token cannot create the site)."
          echo "Enable Settings → Pages → Branch: main → folder: /docs"
